services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      context: ..
      dockerfile: storefront/Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL:-https://api.digidex.bio/graphql/}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://digidex.bio/shop}
        NEXT_PUBLIC_DEFAULT_CHANNEL: ${NEXT_PUBLIC_DEFAULT_CHANNEL:-default-channel}
    restart: unless-stopped
    networks:
      - digidex-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storefront.rule=Host(`digidex.bio`) && PathPrefix(`/shop`)"
      - "traefik.http.routers.storefront.priority=100"
      - "traefik.http.routers.storefront.entrypoints=websecure"
      - "traefik.http.routers.storefront.tls=true"
      - "traefik.http.routers.storefront.tls.certresolver=le"
      - "traefik.http.services.storefront.loadbalancer.server.port=3000"

networks:
  digidex-net:
    external: true
